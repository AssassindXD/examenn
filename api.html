<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>api</title>
</head>
<style>
    body{
        background-color: cadetblue;
    }
    table {
        background-color: white;
        width: 90%;
        height: 50%;
        margin-top: 10px;
        border: solid 2px black;
        border-radius: 10px;
    }
    table th, table td {
        border: solid 1px black;
        text-align: center;
    }
    table th {
        background-color: lightgray;
    }
    tr :hover{
        cursor: pointer;
        background-color: lightgreen;
       
    }
    button{
        background-color: blue;
        border-radius: 10px;
        color: white;
        padding: 5px;
    }



</style>

<body>
<!--Usando HTML + JavaScript (vanilla o framework opcional), consuma la siguiente API:

https://jsonplaceholder.typicode.com/users/

### 🧾 Requisitos del ejercicio:   

1. Realiza una solicitud GET a la API.
2. Muestra los usuarios en pantalla en una tabla o tarjeta.
3. Por cada usuario, debes mostrar:
    - Nombre
    - Correo electrónico
    - Teléfono
    - Ciudad (desde address.city)
    - Empresa (desde company.name)

Agrega un botón que permita recargar los datos (vuelve a hacer fetch).-->
    
<div container>
    <h1>Usuarios de la API</h1>
    <button class="recargar">Recargar Datos</button>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Correo Electrónico</th>
                <th>Teléfono</th>
                <th>Ciudad</th>
                <th>Empresa</th>
            </tr>
        </thead>
    </table>







</div>

<script>
    const boton = document.querySelector('.recargar');
    const tabla = document.querySelector('table');

    function cargarUsuarios() {
        fetch('https://jsonplaceholder.typicode.com/users/')
            .then(respuesta => respuesta.json())
            .then(usuarios => {
                // Elimina filas anteriores si existen
                const filasAnteriores = tabla.querySelectorAll('tbody');
                filasAnteriores.forEach(f => f.remove());

                const tbody = document.createElement('tbody');

                usuarios.forEach(usuario => {
                    const fila = document.createElement('tr');

                    fila.innerHTML = `
                        <td>${usuario.name}</td>
                        <td>${usuario.email}</td>
                        <td>${usuario.phone}</td>
                        <td>${usuario.address.city}</td>
                        <td>${usuario.company.name}</td>
                    `;

                    tbody.appendChild(fila);
                });

                tabla.appendChild(tbody);
            })
            .catch(error => {
                console.error('Error al cargar usuarios:', error);
            });
    }

    
    window.addEventListener('DOMContentLoaded', cargarUsuarios);
    
    boton.addEventListener('click', cargarUsuarios);
</script>



</body>
</html>
